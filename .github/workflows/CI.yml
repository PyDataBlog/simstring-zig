name: Zig CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache python dependencies
        uses: actions/cache@v5
        with:
          path: |
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run and compare benchmarks
        shell: bash
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip uv
          uv venv --clear
          source .venv/bin/activate
          uv pip install simstring-rust
          python benches/run_benches.py --seconds 0.4 --iterations 3 --backends zig-native rust-native-ref python-simstring-zig python-simstring-rust

      - name: Prepare benchmark results commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git stash
          git checkout main
          git stash pop

      - name: Commit benchmark results
        if: startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs(benchmarks): update benchmark results"
          file_pattern: BENCHMARKS.md

      - name: Post benchmark results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '## Benchmark Results';
            const benchmarks = fs.readFileSync('BENCHMARKS.md', 'utf8');
            const body = `${marker}\n\n${benchmarks}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test:
    name: Test on ${{ matrix.os }} with Zig ${{ matrix.zig-version }} and Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.zig-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        zig-version: ["latest", "nightly"]
        exclude:
          - zig-version: nightly
            os: windows-latest
          - zig-version: nightly
            os: macos-latest
    steps:
      - name: Force LF line endings for Zig fmt
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache python dependencies
        if: runner.os != 'macOS'
        uses: actions/cache@v5
        with:
          path: |
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Check formatting
        shell: bash
        run: |
          if [ -d tests ]; then
            zig fmt --check apps src tests
          else
            zig fmt --check apps src
          fi

      - name: Run Zig tests
        run: |
          zig build test -Doptimize=ReleaseFast

      - name: Build Python native library
        run: |
          zig build python-lib -Doptimize=ReleaseFast

      - name: Run Python binding tests
        shell: bash
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip uv
          uv venv --clear
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          uv pip install pytest
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PYTHONPATH="$GITHUB_WORKSPACE/python;$PYTHONPATH"
          else
            export PYTHONPATH="$GITHUB_WORKSPACE/python:$PYTHONPATH"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            export SIMSTRING_ZIG_LIB="$(pwd)/zig-out/bin/simstring_zig_native.dll"
            if [ ! -f "$SIMSTRING_ZIG_LIB" ]; then
              export SIMSTRING_ZIG_LIB="$(pwd)/zig-out/lib/simstring_zig_native.dll"
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export SIMSTRING_ZIG_LIB="$(pwd)/zig-out/lib/libsimstring_zig_native.dylib"
          else
            export SIMSTRING_ZIG_LIB="$(pwd)/zig-out/lib/libsimstring_zig_native.so"
          fi
          pytest tests/python -vv

      - name: Build demo executable
        run: |
          zig build -Doptimize=ReleaseFast

  release:
    name: Create GitHub Release
    needs: [test, benchmark]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
